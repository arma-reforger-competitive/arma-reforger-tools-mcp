[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Developer commands of the reforger plugin repo, for example `cargo xtask import`"
license = "MIT"
publish = false

# The workspace lints without `print_stdout` and `print_stderr`: those protect the stdout of the MCP
# server, but xtask is a command-line tool that prints for a person. Cargo cannot change single
# workspace lints, so the list is here in full. Keep it the same as the workspace list otherwise.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
# -- Serde & Content Formats
html-escape = "0.3.1"
quick-xml = "0.42.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# -- Others
clap = { version = "4.6.7", features = ["derive"] }
