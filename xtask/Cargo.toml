[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Developer commands of the reforger plugin repo, for example `cargo xtask import`"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
# -- Serde & Content Formats
html-escape = "0.3.1"
quick-xml = "0.42.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# -- Others
clap = { version = "4.6.7", features = ["derive"] }
