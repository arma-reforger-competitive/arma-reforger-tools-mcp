name: CI

on:
  push:
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: package.json
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp test run
