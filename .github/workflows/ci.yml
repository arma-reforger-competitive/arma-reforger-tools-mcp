name: CI

on:
  push:
  pull_request:

# A new push stops the run of the same branch or PR that is still going. Each event type has its
# own group, so the push run and the pull_request run of one commit do not stop each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Every check, in the order of `cargo xtask ci` (xtask/src/ci.rs).
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the Rust version from rust-toolchain.toml on the first cargo command.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,ast-grep,cargo-nextest
      - run: cargo xtask ci
