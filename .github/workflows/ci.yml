name: CI

on:
  push:
  pull_request:

jobs:
  # Every check, in the order of `cargo xtask ci` (xtask/src/ci.rs).
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the Rust version from rust-toolchain.toml on the first cargo command.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,ast-grep
      - run: cargo xtask ci
