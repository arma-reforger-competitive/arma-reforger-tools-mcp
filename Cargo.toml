[package]
name = "reforger"
version = "0.1.0"
edition = "2024"
description = "MCP server of the reforger Claude Code plugin for Arma Reforger modding"
license = "MIT"
repository = "https://github.com/lanka-community/arma-reforger-tools-mcp"
publish = false

# The xtask crate holds developer commands. `cargo build --release` does not build it.
[workspace]
members = ["xtask"]

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dependencies]
# -- Async
tokio = { version = "1.54.1", features = ["macros", "rt", "io-std", "io-util", "net", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
# -- MCP
rmcp = { version = "3.10.0", features = ["transport-io"] }
schemars = "1.2.3"
# -- Serde & Content Formats
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# -- Others
strsim = "0.11.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[dev-dependencies]
proptest = "1.12.0"
rmcp = { version = "3.10.0", features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "process", "io-util", "time"] }
