[package]
name = "reforger"
version = "0.1.0"
edition = "2024"
description = "MCP server of the reforger Claude Code plugin for Arma Reforger modding"
license = "MIT"
repository = "https://github.com/arma-reforger-competitive/arma-reforger-tools-mcp"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dependencies]
rmcp = { version = "3.10.0", features = ["transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.10.0", features = ["client", "transport-child-process"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "process", "io-util"] }
